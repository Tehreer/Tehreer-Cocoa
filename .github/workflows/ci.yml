name: iOS CI

on:
  push:
    branches: [master, develop]
    paths-ignore:
      - '*.md'
  pull_request:
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and Demo Build
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          xcode=$(printf '%s\n' /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache Build
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('.git/modules/Libraries/TehreerCore/HEAD') }}
          restore-keys: build-${{ runner.os }}-

      - name: Test and Build Demo
        run: bundle exec fastlane ios ci

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-output
          path: Fastlane/test_output
